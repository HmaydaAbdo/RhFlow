
# ─────────────────────────────────────────────────────────────────────────────
# RH Flow — Infrastructure locale de développement
#
# Services inclus :
#   postgres      — Base de données principale (pgvector)
#   pgadmin       — Interface d'administration PostgreSQL
#   minio         — Stockage objet S3-compatible pour les CVs
#   docling-serve — Microservice de parsing documents (PDF/DOCX → Markdown)
#
# ── Démarrage ─────────────────────────────────────────────────────────────────
#   cp .env.example .env        # Remplir les variables requises
#   docker compose up -d        # Démarrer l'infrastructure
#   ./mvnw spring-boot:run      # Démarrer Spring Boot en local
#
# ── Réseau & presigned URLs MinIO ─────────────────────────────────────────────
#   Spring Boot tourne en local (hôte) et génère des presigned URLs MinIO.
#   docling-serve tourne dans Docker et doit pouvoir les consommer.
#
#   Solution : un seul MINIO_ENDPOINT canonique (cf. .env / .env.example) +
#   DNS override côté SDK pour Spring Boot :
#     - MINIO_ENDPOINT = http://host.docker.internal:9000
#         → hostname signé + injecté dans les presigned URLs
#         → docling le résout via extra_hosts ci-dessous (host-gateway)
#     - MINIO_SDK_HOST_OVERRIDE = host.docker.internal=127.0.0.1
#         → côté Spring Boot, le SDK MinIO ouvre les TCP vers 127.0.0.1
#         → la signature reste valide (le hostname signé n'est pas modifié)
#
#   docling-serve résout host.docker.internal grâce à extra_hosts ci-dessous :
#     - Linux : host-gateway = IP de la passerelle Docker
#     - Mac/Windows Docker Desktop : résolu nativement, extra_hosts ignoré
#
# ── Variables d'environnement requises (.env) ──────────────────────────────────
#   DB_PASSWORD, MINIO_SECRET_KEY, PGADMIN_PASSWORD  → obligatoires (:? dans compose)
#   MINIO_ENDPOINT, MINIO_SDK_HOST_OVERRIDE          → requis par Spring Boot
# ─────────────────────────────────────────────────────────────────────────────

networks:
  rh-network:
    driver: bridge

services:

  # ========== DATABASE ==========
  postgres:
    image: pgvector/pgvector:pg17
    container_name: rh-erp-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-rh_erp_db}
      POSTGRES_USER:     ${DB_USERNAME:-rh_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro   # ← add this
    networks:
      - rh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rh_admin} -d ${POSTGRES_DB:-rh_erp_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: rh-erp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL:-admin@rh-erp.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rh-network

  # ========== OBJECT STORAGE ==========
  # MinIO : stockage S3-compatible pour les CVs uploadés.
  #
  # Console web : http://localhost:9001
  # API S3      : http://localhost:9000  (accès hôte)
  #             : http://minio:9000      (accès inter-containers)
  #
  # IMPORTANT — Configuration .env :
  #   MINIO_ENDPOINT=http://host.docker.internal:9000              (canonique)
  #   MINIO_SDK_HOST_OVERRIDE=host.docker.internal=127.0.0.1       (DNS SDK only)
  # Voir .env.example pour la rationale (signature SigV4 + DNS override).
  minio:
    image: minio/minio:latest
    container_name: rh-erp-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks:
      - rh-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== DOCUMENT PARSING ==========
  # docling-serve : microservice IA de conversion de documents.
  # Reçoit une URL présignée MinIO et retourne le contenu en Markdown structuré.
  # Gère : PDF natifs, DOCX, tableaux, mise en page complexe, OCR si nécessaire.
  #
  # API REST : http://localhost:5001
  # Endpoint : POST /v1/convert/source       (synchrone — bloque jusqu'au résultat)
  # Health   : GET  /health
  #
  # ⚠ VERSION PINNÉE — NE PAS BASCULER SUR :latest
  #   Le SDK docling-java 0.3.0 (embarqué par Arconia 0.20.0) appelle l'endpoint
  #   synchrone `/v1/convert/source`. À partir de docling-serve v1.16.0, l'API
  #   client a été restructurée et l'endpoint sync n'est plus garanti.
  #   v1.9.0 est la version testée et qualifiée par Arconia 0.20.0
  #   (cf. arconia.dev.services.docling.image-name dans Arconia source).
  #
  # extra_hosts :
  #   Permet à docling-serve de résoudre "host.docker.internal" vers la machine hôte.
  #   Nécessaire pour que les presigned URLs MinIO (http://host.docker.internal:9000/...)
  #   générées par Spring Boot (qui tourne hors Docker) soient téléchargeables par
  #   docling-serve depuis le réseau Docker.
  #   Linux : extra_hosts fournit la résolution (host-gateway = IP hôte Docker).
  #   Mac/Windows Docker Desktop : résolu nativement.
  #
  # GPU (optionnel, performances ×3–5) :
  #   Décommenter le bloc "deploy" ci-dessous si une carte NVIDIA est disponible.
  #   Pour le GPU, basculer sur l'image `docling-serve` (sans suffixe -cpu).
  docling-serve:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.9.0
    container_name: rh-erp-docling
    restart: unless-stopped
    ports:
      - "5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rh-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # docling-serve charge ses modèles IA au démarrage (~60–90 s)

  n8n:
    image: n8nio/n8n:latest
    container_name: rh-erp-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n_db}
      DB_POSTGRESDB_USER: ${DB_USERNAME:-rh_admin}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY must be set in .env}
      GENERIC_TIMEZONE: ${TZ:-Africa/Casablanca}
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data/n8n:/home/node/.n8n
    networks:
      - rh-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

